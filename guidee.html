<style>

</style></head><body><main><h1>Nous faisons ensemble</h1><div class="bar"><i id="pb"></i></div><div class="card" id="c" aria-live="polite"></div></main>
<script>
const Q=[{"t": "num", "vk": "a", "v": {"a": [3, 2, 5], "b": [1, 4, 8], "c": ["", "", ""], "r": ["", "", ""]}, "q": "Dans 325 + 148, combien font 5 + 8 ?", "ans": 13, "wrong": {"12": "Presque ! Compte à partir de 8 : 9, 10, 11, 12, 13.", "3": "Tu as déjà donné le chiffre à écrire. Ici, on additionne : 5 + 8 = ?"}, "hint": "Compte à partir de 8 : 9, 10, 11, 12, 13…", "ok": "5 + 8 = 13."}, {"t": "choice", "vk": "a", "q": "13 unités, c’est :", "opts": ["1 dizaine et 3 unités", "3 dizaines et 1 unité", "13 dizaines"], "ans": 0, "hint": "10 unités font 1 dizaine. Alors 13 unités, c’est 1 dizaine et combien d’unités ?", "ok": "13 unités = 1 dizaine + 3 unités."}, {"t": "cols", "vk": "a", "a": 325, "b": 148, "need": ["r2", "c1"], "q": "Je remplis la case des unités et la retenue (case rouge au-dessus des dizaines).", "ok": "J’écris 3 et je retiens 1."}, {"t": "cols", "vk": "a", "a": 325, "b": 148, "need": ["r1"], "q": "Dizaines : 2 + 4 + la retenue. J’écris le résultat dans la case des dizaines.", "ok": "2 + 4 + 1 = 7."}, {"t": "cols", "vk": "a", "a": 325, "b": 148, "need": ["r0"], "q": "Centaines : 3 + 1. J’écris le résultat dans la case des centaines.", "ok": "3 + 1 = 4."}, {"t": "num", "vk": "a", "q": "Quel est le résultat de 325 + 148 ?", "ans": 473, "wrong": {"463": "Tu as oublié la retenue (le petit 1) aux dizaines."}, "hint": "Lis les chiffres du résultat : centaines, dizaines, unités.", "ok": "325 + 148 = 473."}, {"t": "choice", "q": "6 + 7 = ?", "opts": ["12", "13", "14"], "ans": 1, "hint": "6 + 6 = 12, donc 6 + 7 = ?", "ok": "6 + 7 = 13."}, {"t": "choice", "q": "10 unités, c’est :", "opts": ["1 dizaine", "1 centaine", "10 dizaines"], "ans": 0, "hint": "Quand j’ai 10 unités, je fais un paquet : c’est une dizaine.", "ok": "10 unités = 1 dizaine."}, {"t": "choice", "q": "4 + 2 + 1 (retenue) = ?", "opts": ["6", "7", "8"], "ans": 1, "hint": "N’oublie pas d’ajouter la retenue !", "ok": "4 + 2 + 1 = 7."}, {"t": "choice", "vk": "k", "v": {"a": [1, 3, 8], "b": [2, 4, 5], "c": ["", "", ""], "r": ["3", "7", "3"], "bad": true}, "q": "Karim a calculé 138 + 245 = 373. Quelle est son erreur ?", "opts": ["Il a oublié la retenue", "Il a mal aligné les nombres", "Il a commencé par les centaines"], "ans": 0, "hint": "Regarde les unités : 8 + 5 = 13. Qu’est-ce que Karim devait faire du 1 ?", "ok": "8 + 5 = 13 : il fallait retenir 1 pour les dizaines."}, {"t": "num", "vk": "k", "q": "Écris le bon résultat de 138 + 245.", "ans": 383, "wrong": {"373": "C’est le résultat de Karim ! Pense à la retenue : 3 + 4 + 1 = 8."}, "hint": "Unités : 8 + 5 = 13 (j’écris 3, je retiens 1). Dizaines : 3 + 4 + 1 = ?", "ok": "138 + 245 = 383.", "set": {"r": ["3", "8", "3"], "c": ["", "1", ""], "bad": false}}];const NAMES=["unités","dizaines","centaines"];
const $=s=>document.querySelector(s);let V={},i=0,tries=0,res=[],hs=0,cur=null;
const dg=n=>[n%10,Math.floor(n/10)%10,Math.floor(n/100)%10];
function viz(v){const row=(a,c)=>a.map(x=>`<div class="cell ${c||""}">${x}</div>`).join("");
 return `<div class="op"><div class="g"><span></span>${["C","D","U"].map(l=>`<b class="h">${l}</b>`).join("")}<span></span>${row(v.c,"car")}<span></span>${row(v.a)}<span class="pl">+</span>${row(v.b)}<span></span>${v.r.map(x=>`<div class="cell res ${v.bad?"bad":""}">${x===""?"?":x}</div>`).join("")}</div></div>`}
const LAB={c0:"Retenue au-dessus des centaines",c1:"Retenue au-dessus des dizaines",r2:"Unités",r1:"Dizaines",r0:"Centaines"};
function vizc(v,need){const inp=(k,c)=>`<input class="ci ${c}" data-k="${k}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="${LAB[k]}">`;
 const cell=(k,c,val)=>need.includes(k)?inp(k,c):`<div class="cell ${c}">${val}</div>`;
 const cr=k=>`<div class="cell res">${v.r[+k[1]]===""?"?":v.r[+k[1]]}</div>`;const rs=k=>need.includes(k)?inp(k,"res"):cr(k);const row=a=>a.map(x=>`<div class="cell">${x}</div>`).join("");
 return `<div class="op"><div class="g"><span></span>${["C","D","U"].map(l=>`<b class="h">${l}</b>`).join("")}<span></span>${cell("c0","car",v.c[0])}${cell("c1","car",v.c[1])}<div></div><span></span>${row(v.a)}<span class="pl">+</span>${row(v.b)}<span></span>${rs("r0")}${rs("r1")}${rs("r2")}</div></div>`}
function expd(a,b){const A=dg(a),B=dg(b),s0=A[0]+B[0],c1=s0>9?1:0,s1=A[1]+B[1]+c1,c0=s1>9?1:0,s2=A[2]+B[2]+c0;return{A,B,s0,s1,s2,c1,c0,r2:s0%10,r1:s1%10,r0:s2%10}}
const EV=(e,k)=>k[0]==="c"?(e[k]?"1":""):String(e[k]);
function msgc(k,val,e){const{A,B}=e;if(k==="r2")return val===""?"Remplis la case des unités.":(e.s0>9&&val===String(e.c1))?`${A[0]} + ${B[0]} = ${e.s0} : dans la case des unités, j’écris seulement le chiffre des unités. Le 1 est la retenue : je le place au-dessus des dizaines.`:`Unités : ${A[0]} + ${B[0]}. Combien ça fait ? J’écris seulement le chiffre des unités.`;
 if(k==="c1")return e.c1?`Regarde : ${A[0]} + ${B[0]} = ${e.s0}, ça dépasse 9. Je retiens 1 au-dessus des dizaines.`:`Pas de retenue ici : ${A[0]} + ${B[0]} = ${e.s0}, ça ne dépasse pas 9. Je laisse la case vide.`;
 if(k==="c0")return e.c0?`Regarde : ${A[1]} + ${B[1]}${e.c1?" + 1":""} = ${e.s1}, ça dépasse 9. Je retiens 1 au-dessus des centaines.`:`Pas de retenue aux centaines : ${A[1]} + ${B[1]}${e.c1?" + 1":""} = ${e.s1}. Je laisse la case vide.`;
 const j=k==="r1"?1:2,cr=k==="r1"?e.c1:e.c0,nm=j===1?"dizaines":"centaines";if(val==="")return`Remplis la case des ${nm}.`;
 return cr&&val===String((A[j]+B[j])%10)?`N’oublie pas d’ajouter la retenue : ${A[j]} + ${B[j]} + 1.`:`${nm[0].toUpperCase()+nm.slice(1)} : ${A[j]} + ${B[j]}${cr?" + 1 (retenue)":""}. Combien ça fait ?`}
function aide(a,b){const A=dg(a),B=dg(b);let c=0,L=[];for(let k=0;k<3;k++){const s=A[k]+B[k]+c;L.push(`${NAMES[k][0].toUpperCase()+NAMES[k].slice(1)} : ${A[k]} + ${B[k]}${c?" + 1 (retenue)":""} = ${s}`+(s>9?` → j’écris ${s%10}, je retiens 1`:` → j’écris ${s}`));c=s>9?1:0}return L}
function diag(a,b,u){const A=dg(a),B=dg(b),S=dg(a+b),U=dg(u);const nc=A.map((x,k)=>(x+B[k])%10);
 if(u===nc[0]+10*nc[1]+100*nc[2])return"Tu as oublié la retenue ! Quand une colonne dépasse 9, j’écris les unités et je retiens 1 pour la colonne suivante.";
 let c=0;for(let k=0;k<3;k++){const s=A[k]+B[k]+c;if(U[k]!==s%10)return`Regarde la colonne des ${NAMES[k]} : ${A[k]} + ${B[k]}${c?" + 1 (retenue)":""}. Combien ça fait ? Attention à ce que tu écris et à ce que tu retiens.`;c=s>9?1:0}
 return"Vérifie ton calcul colonne par colonne, en commençant par les unités."}
function show(){const it=Q[i];if(it.t==="exch")return showX();if(it.t==="order")return showO();tries=0;hs=0;if(it.vk&&!V[it.vk])V[it.vk]=JSON.parse(JSON.stringify(it.v));
 const C=it.t==="op"||it.t==="cols";if(it.t==="op")it.need=["c1","c0","r2","r1","r0"];
 const v=it.vk?V[it.vk]:(it.t==="op"?{a:dg(it.a).reverse(),b:dg(it.b).reverse(),c:["","",""],r:["","",""]}:null);
 $("#pb").style.width=(i/Q.length*100)+"%";
 let h=`<div class="tag">Question ${i+1} / ${Q.length}${it.defi?" · ⭐ Défi":""}</div><div class="q">${it.q||`Calcule : ${it.a} + ${it.b}`}</div>${v?(C?vizc(v,it.need):viz(v)):""}${C?`<div class="tag" style="text-align:center">Petites cases rouges = la retenue</div>`:""}`;
 if(it.t==="choice")h+=`<div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${"ABC"[k]}) ${o}</button>`).join("")}</div>`;
 else if(C)h+=`<button class="btn" id="ck">Vérifier</button>`;else h+=`<input id="in" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Ma réponse" aria-label="Ma réponse"><button class="btn" id="ck">Vérifier</button>`;
 h+=`<div class="fb" id="fb"></div>`;if(it.t==="op")h+=`<button class="btn sec" id="ai">💡 Un coup de pouce</button><div class="aide" id="ad"></div>`;
 h+=`<button class="btn sec" id="sol" style="display:none">Voir la réponse</button><button class="btn" id="nx" style="display:none">Suivant →</button>`;
 $("#c").innerHTML=h;const fb=(k,m)=>{const f=$("#fb");f.className="fb "+k;f.textContent=m};
 const good=()=>{res[i]=tries===0?"1":"2";if(it.set)Object.assign(V[it.vk],it.set);if(C){document.querySelectorAll(".ci").forEach(x=>{x.disabled=true;x.classList.remove("bad");x.classList.add("ok")});$("#ck").style.display="none";if(it.vk)it.need.forEach(k=>{V[it.vk][k[0]][+k[1]]=EV(expd(it.a,it.b),k)})}else if(it.t==="num"){$("#in").disabled=true;$("#ck").style.display="none"}
  if(it.vk)$("#c").querySelector(".op").outerHTML=(C?vizc(V[it.vk],[]):viz(V[it.vk]));fb("ok",(tries===0?"✅ Bravo ! ":"✅ Bien joué, tu as trouvé ! ")+(it.ok||""));nx()};
 const nx=()=>{if($("#sol"))$("#sol").style.display="none";if($("#ai"))$("#ai").style.display="none";const n=$("#nx");n.style.display="block";n.textContent=i+1<Q.length?"Suivant →":"Voir mon résultat";n.onclick=()=>{i++;i<Q.length?show():end()};n.focus()};
 const bad=m=>{tries++;fb("no","❌ "+m);if(tries>=2)$("#sol").style.display="block"};
 $("#sol").onclick=()=>{res[i]="3";fb("hint","Réponse : "+(it.t==="choice"?it.opts[it.ans]:(C?(it.t==="op"?it.a+it.b:"les cases ci-dessus"):it.ans))+". "+(it.ok||""));if(C){const e=expd(it.a,it.b);document.querySelectorAll(".ci").forEach(x=>{x.value=EV(e,x.dataset.k);x.disabled=true});if(it.vk)it.need.forEach(k=>{V[it.vk][k[0]][+k[1]]=EV(e,k)})}$("#in")&&($("#in").disabled=true);$("#ck")&&($("#ck").style.display="none");nx()};
 if(it.t==="choice")$("#c").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k===it.ans){b.classList.add("yes");$("#c").querySelectorAll(".opt").forEach(x=>x.disabled=true);good()}else{b.classList.add("no");b.disabled=true;bad(it.hint||"Essaie encore !")}});
 else if(C){const e=expd(it.a,it.b),O=["r2","c1","r1","c0","r0"].filter(k=>it.need.includes(k));
  const go=()=>{let first=null;O.forEach(k=>{const x=document.querySelector(`.ci[data-k="${k}"]`);let val=x.value.trim();if(k[0]==="c"&&val==="0")val="";const okc=val===EV(e,k);x.classList.toggle("ok",okc);x.classList.toggle("bad",!okc);if(!okc&&first===null)first=[k,val]});
   if(!first)good();else{const bd=document.querySelector(".ci.bad");bad(msgc(first[0],first[1],e));bd&&bd.focus()}};
  $("#ck").onclick=go;document.querySelectorAll(".ci").forEach(x=>x.onkeydown=ev=>{if(ev.key==="Enter")go()});const f0=document.querySelector(`.ci[data-k="${O[0]}"]`);f0&&f0.focus()}
 else{const go=()=>{const raw=$("#in").value.replace(/\s/g,"");if(!/^\d+$/.test(raw)){fb("hint","Écris un nombre avec des chiffres.");return}const u=+raw,ans=it.t==="op"?it.a+it.b:it.ans;
  if(u===ans)good();else bad((it.wrong&&it.wrong[u])||(it.t==="op"?diag(it.a,it.b,u):(it.hint||"Essaie encore !")))};$("#ck").onclick=go;$("#in").onkeydown=e=>{if(e.key==="Enter")go()};$("#in").focus()}
 if(it.t==="op")$("#ai").onclick=()=>{const L=aide(it.a,it.b);hs=Math.min(hs+1,L.length);const d=$("#ad");d.style.display="block";d.innerHTML=L.slice(0,hs).join("<br>")}}
function showX(){const it=Q[i];$("#pb").style.width=(i/Q.length*100)+"%";const A=dg(it.a),B=dg(it.b);let cu=A[0]+B[0],ba=A[1]+B[1],sel=new Set(),ex=false,tr=0;
 const fb=(k,m)=>{const f=$("#fb");f.className="fb "+k;f.textContent=m};
 const draw=(m,k)=>{$("#c").innerHTML=`<div class="tag">Question ${i+1} / ${Q.length} · 🧊 Machine à échanger</div><div class="q">${it.a} + ${it.b} : je réunis tout, puis j’échange.</div><div class="blocks">${"<i class=\"br\"></i>".repeat(ba)}<span class="cus">${Array.from({length:cu},(_,n)=>`<button class="cb ${sel.has(n)?"on":""}" data-n="${n}" aria-label="cube ${n+1}"></button>`).join("")}</span></div>`
  +(ex?`<div class="q">Je compte : <input class="ci" id="dz" inputmode="numeric" maxlength="2" aria-label="dizaines"> dizaines et <input class="ci" id="un" inputmode="numeric" maxlength="2" aria-label="unités"> unités</div><button class="btn" id="ck">Vérifier</button>`:`<p>Les barres sont des <b>dizaines</b>, les petits cubes des <b>unités</b>. Touche exactement <b>10 cubes</b>, puis échange-les contre 1 barre.</p><button class="btn" id="exb">Échanger les cubes choisis</button>`)+`<div class="fb ${k||""}" id="fb">${m||""}</div><button class="btn" id="nx" style="display:none"></button>`;
  $("#c").querySelectorAll(".cb").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle("on")});
  if($("#exb"))$("#exb").onclick=()=>{if(sel.size!==10){tr++;fb("no","❌ Tu as choisi "+sel.size+" cube"+(sel.size>1?"s":"")+" : il en faut exactement 10.")}else{cu-=10;ba++;sel.clear();ex=true;draw("✅ 10 unités = 1 dizaine ! Une nouvelle barre apparaît.","ok")}};
  if($("#ck"))$("#ck").onclick=()=>{const d=$("#dz").value.trim(),u=$("#un").value.trim();if(+d===ba&&+u===cu&&d!==""&&u!==""){$("#dz").disabled=$("#un").disabled=true;$("#ck").style.display="none";fb("ok","✅ "+(tr?"Bien joué !":"Bravo !")+" "+it.a+" + "+it.b+" = "+(it.a+it.b)+".");res[i]=tr?"2":"1";const n=$("#nx");n.style.display="block";n.textContent=i+1<Q.length?"Suivant →":"Voir mon résultat";n.onclick=()=>{i++;i<Q.length?show():end()}}else{tr++;fb("no","❌ Compte les barres (dizaines), puis les cubes qui restent (unités).")}}};
 draw()}
function showO(){const it=Q[i];$("#pb").style.width=(i/Q.length*100)+"%";const n=it.steps.length,perm=[2,0,3,1,4,5].filter(k=>k<n);let seq=[],tr=0;
 const fb=(k,m)=>{const f=$("#fb");f.className="fb "+k;f.textContent=m};
 const draw=(m,k)=>{$("#c").innerHTML=`<div class="tag">Question ${i+1} / ${Q.length} · 🔢 Mettre dans l’ordre</div><div class="q">${it.q}</div><div class="opts">${perm.map(j=>`<button class="opt ${seq.includes(j)?"yes":""}" data-j="${j}" ${seq.includes(j)?"disabled":""}>${seq.includes(j)?(seq.indexOf(j)+1)+". ":""}${it.steps[j]}</button>`).join("")}</div><div class="fb ${k||""}" id="fb">${m||""}</div><button class="btn" id="nx" style="display:none"></button>`;
  $("#c").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(j===seq.length){seq.push(j);if(seq.length===n){draw("✅ "+(tr?"Bien joué ! ":"Bravo ! ")+(it.ok||""),"ok");res[i]=tr?"2":"1";const x=$("#nx");x.style.display="block";x.textContent=i+1<Q.length?"Suivant →":"Voir mon résultat";x.onclick=()=>{i++;i<Q.length?show():end()}}else draw("✅ Oui ! Et ensuite ?","ok")}else{tr++;fb("no","❌ Pas encore : cette étape ne vient pas à cette place. "+(it.hint||"Réfléchis à l’ordre du calcul."))}})};
